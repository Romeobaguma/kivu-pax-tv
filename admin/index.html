<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration — KIVU PAX TV</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Inter', sans-serif; }
    #nc-root { min-height: 100vh; }
    /* Chargement */
    .kpt-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a2540;
      color: #fff;
      font-family: 'Inter', sans-serif;
      z-index: 9999;
    }
    .kpt-loader__logo {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      margin-bottom: 24px;
      color: #f4a261;
    }
    .kpt-loader__spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #f4a261;
      border-radius: 50%;
      animation: kpt-spin 0.9s linear infinite;
    }
    @keyframes kpt-spin {
      to { transform: rotate(360deg); }
    }
    .kpt-loader__text {
      margin-top: 18px;
      font-size: 0.88rem;
      color: rgba(255,255,255,0.6);
    }
  </style>
</head>
<body>

  <div id="kpt-loading" class="kpt-loader">
    <div class="kpt-loader__logo">KIVU PAX TV</div>
    <div class="kpt-loader__spinner"></div>
    <div class="kpt-loader__text">Chargement de l'administration…</div>
  </div>

  <!-- Scripts Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.1.0/dist/decap-cms.js"></script>
  <script src="https://unpkg.com/netlify-cms-media-library-cloudinary@^1.3.10/dist/main.js"></script>

  <script>
    // Enregistrer la bibliothèque Cloudinary (si présente)
    if (window.netlifyCmsMediaLibraryCloudinary) {
      CMS.registerMediaLibrary(window.netlifyCmsMediaLibraryCloudinary);
    }

    // Masquer le loader dès que Decap CMS est prêt
    window.addEventListener('load', () => {
      setTimeout(() => {
        const loader = document.getElementById('kpt-loading');
        if (loader) loader.style.display = 'none';
      }, 400);
    });

    // Sécurité : si erreur de chargement, retirer le loader après 5s
    setTimeout(() => {
      const loader = document.getElementById('kpt-loading');
      if (loader) loader.style.display = 'none';
    }, 5000);
  </script>

</body>
</html>
