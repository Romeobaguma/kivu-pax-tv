<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration — KIVU PAX TV</title>
  <meta name="robots" content="noindex, nofollow">

  <!-- ⚠️ IMPORTANT : le widget Identity DOIT être chargé en premier -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; font-family: 'Inter', sans-serif; }
    #nc-root { min-height: 100vh; }

    /* Loader pendant le chargement de Decap */
    .kpt-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a2540;
      color: #fff;
      z-index: 9999;
    }
    .kpt-loader__logo {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      margin-bottom: 26px;
      color: #f4a261;
    }
    .kpt-loader__spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #f4a261;
      border-radius: 50%;
      animation: kpt-spin 0.9s linear infinite;
    }
    @keyframes kpt-spin { to { transform: rotate(360deg); } }
    .kpt-loader__text {
      margin-top: 20px;
      font-size: 0.88rem;
      color: rgba(255,255,255,0.6);
    }
  </style>
</head>
<body>

  <div id="kpt-loading" class="kpt-loader">
    <div class="kpt-loader__logo">KIVU PAX TV</div>
    <div class="kpt-loader__spinner"></div>
    <div class="kpt-loader__text">Chargement de l'administration…</div>
  </div>

  <!-- Scripts Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.1.0/dist/decap-cms.js"></script>
  <script src="https://unpkg.com/netlify-cms-media-library-cloudinary@^1.3.10/dist/main.js"></script>

  <script>
    /* 1. Enregistrer la bibliothèque Cloudinary (si présente) */
    if (window.netlifyCmsMediaLibraryCloudinary) {
      CMS.registerMediaLibrary(window.netlifyCmsMediaLibraryCloudinary);
    }

    /* 2. Gérer l'initialisation de Netlify Identity
       — Ouvre la fenêtre de mot de passe si un jeton d'invitation est présent
       — Redirige vers /admin/ après connexion
    */
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on('init', user => {
        if (!user) {
          window.netlifyIdentity.on('login', () => {
            document.location.href = '/admin/';
          });
        }
      });
    }

    /* 3. Masquer le loader dès que Decap CMS est prêt */
    window.addEventListener('load', () => {
      setTimeout(() => {
        const loader = document.getElementById('kpt-loading');
        if (loader) loader.style.display = 'none';
      }, 300);
    });

    /* 4. Sécurité : cacher le loader après 4s quoi qu'il arrive */
    setTimeout(() => {
      const loader = document.getElementById('kpt-loading');
      if (loader) loader.style.display = 'none';
    }, 4000);
  </script>

</body>
</html>
