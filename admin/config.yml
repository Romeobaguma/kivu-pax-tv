backend:
  name: git-gateway
  branch: main

locale: fr

media_library:
  name: cloudinary
  config:
    cloud_name: vzh3xban
    api_key: 851826499922689

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  # ============================================================
  # ARTICLES
  # ============================================================
  - name: "articles"
    label: "Articles"
    label_singular: "Article"
    files:
      - name: "liste"
        label: "Liste des articles"
        file: "contenu/articles.json"
        fields:
          - label: "Articles"
            name: "articles"
            widget: "list"
            summary: "{{fields.title}} — {{fields.date}}"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
              - label: "Catégorie"
                name: "category"
                widget: "select"
                options:
                  - { label: "Afrique", value: "afrique" }
                  - { label: "Asie", value: "asie" }
                  - { label: "Europe", value: "europe" }
                  - { label: "Amériques", value: "ameriques" }
                  - { label: "International", value: "international" }
              - { label: "Image de couverture", name: "image", widget: "image", required: false }
              - { label: "Résumé / Contenu", name: "body", widget: "text" }
              - { label: "Lien externe (optionnel)", name: "url", widget: "string", required: false }

  # ============================================================
  # VIDÉOS
  # ============================================================
  - name: "videos"
    label: "Vidéos"
    label_singular: "Vidéo"
    files:
      - name: "liste"
        label: "Liste des vidéos"
        file: "contenu/videos.json"
        fields:
          - label: "Vidéos"
            name: "videos"
            widget: "list"
            summary: "{{fields.title}} — {{fields.date}}"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
              - { label: "Miniature", name: "thumbnail", widget: "image", required: false }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Lien de la vidéo (YouTube, Vimeo, Cloudinary…)", name: "url", widget: "string" }

  # ============================================================
  # PHOTOS
  # ============================================================
  - name: "photos"
    label: "Photos"
    label_singular: "Photo"
    files:
      - name: "galerie"
        label: "Galerie photo"
        file: "contenu/photos.json"
        fields:
          - label: "Photos"
            name: "photos"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Titre / Légende", name: "title", widget: "string" }
              - { label: "Image", name: "image", widget: "image" }

  # ============================================================
  # DOCUMENTS
  # ============================================================
  - name: "documents"
    label: "Documents"
    label_singular: "Document"
    files:
      - name: "liste"
        label: "Liste des documents"
        file: "contenu/documents.json"
        fields:
          - label: "Documents"
            name: "documents"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Taille (ex : 2,4 Mo)", name: "size", widget: "string", required: false }
              - { label: "Fichier (PDF, DOCX…)", name: "file", widget: "file" }